# CI for yr-sites (YAORONG LED + YR GRID AI sales sites).
# Runs on every push / PR touching yr-sites: unit + API tests, both site builds, browser E2E
# (desktop + mobile Chromium) and a Docker production-start smoke test for each site.
name: yr-sites CI

on:
  push:
    paths: ['yr-sites/**', '.github/workflows/yr-sites-ci.yml']
  pull_request:
    paths: ['yr-sites/**', '.github/workflows/yr-sites-ci.yml']
  workflow_dispatch:

concurrency:
  group: yr-sites-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: yr-sites

jobs:
  test:
    name: Unit · API · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: yr-sites/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit + API tests (node:test)
        run: mkdir -p test-results && pnpm test:ci
      - name: Build both sites (Astro)
        run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E (desktop + mobile)
        run: pnpm test:e2e
        env:
          CI: 'true'
      - name: Test summary
        if: always()
        run: node scripts/test-summary.mjs test-results/node-junit.xml test-results/e2e-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            yr-sites/test-results/
          retention-days: 14

  docker:
    name: Docker smoke (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: [led, grid]
    steps:
      - uses: actions/checkout@v4
      - name: Build image, start like production, check health / seeding / site build / API
        run: bash scripts/docker-smoke.sh ${{ matrix.site }}
